name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  test:
    name: Go ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-amd64
            goos: linux
            goarch: amd64
            library: liblancedb.so
          - os: ubuntu-22.04-arm
            target: linux-arm64
            goos: linux
            goarch: arm64
            library: liblancedb.so
          - os: macos-15
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            library: liblancedb.dylib
          - os: windows-2025
            target: windows-amd64
            goos: windows
            goarch: amd64
            library: lancedb.dll
          - os: windows-11-arm
            target: windows-arm64
            goos: windows
            goarch: arm64
            library: lancedb.dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: true

      - name: Configure native cache
        shell: bash
        run: echo "LANCEDB_C_CACHE_DIR=$RUNNER_TEMP/lancedb-native" >> "$GITHUB_ENV"

      - name: Check formatting and vet
        shell: bash
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go vet ./...

      - name: Loader and ABI layout tests
        shell: bash
        run: go test -count=1 ./pkg/internal/native

      - name: Offline consumer harness self-tests
        shell: bash
        run: |
          PYTHON=$(command -v python3 || command -v python)
          bash -n scripts/offline-consumer/run.sh
          bash -n scripts/offline-consumer/run-checkout.sh
          bash -n scripts/offline-consumer/lib.sh
          "$PYTHON" scripts/offline-consumer/verify_test.py

      - name: Cold offline default Connect (checkout consumer)
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          LIBRARY_NAME: ${{ matrix.library }}
          EVIDENCE_DIR: ${{ runner.temp }}/offline-checkout-evidence
        run: bash scripts/offline-consumer/run-checkout.sh

      - name: Cache native artifact
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lancedb-native
          key: native-${{ matrix.target }}-${{ hashFiles('pkg/internal/native/manifest.go') }}

      - name: Install native artifact and run tests
        shell: bash
        run: |
          go run ./pkg/cmd/lancedb-go-native
          go test -count=1 ./...

      - name: Explicit override path
        shell: bash
        run: |
          LIB="$(go run ./pkg/cmd/lancedb-go-native)"
          LANCEDB_C_LIBRARY_PATH="$LIB" go test ./pkg/tests -run 'TestTableName|TestMultiBatchIPCConcatenation|TestSQLDialectColumnVersusLiteral' -count=1

      # The examples module imports the SDK as an external module at the exact
      # checkout, so this also proves the public import path and native runtime.
      - name: External module consumer
        shell: bash
        run: |
          cd examples
          go run -mod=readonly ./basic_crud
          go test -mod=readonly -count=1 -run 'TestTableName|TestMultiBatchIPCConcatenation|TestSQLDialectColumnVersusLiteral' github.com/lancedb/lancedb-go/pkg/tests

      - name: Build all packages without cgo
        shell: bash
        run: go build ./...

  integration:
    name: Authenticated S3 and AWS profiles
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: true

      - name: Configure native cache
        shell: bash
        run: echo "LANCEDB_C_CACHE_DIR=$RUNNER_TEMP/lancedb-native" >> "$GITHUB_ENV"

      - name: Cache native artifact
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lancedb-native
          key: native-integration

      - name: Install native artifact
        shell: bash
        run: go run ./pkg/cmd/lancedb-go-native

      - name: Install loopback S3 fixture
        shell: bash
        run: |
          curl -fL --retry 3 --max-time 300 \
            -o "$RUNNER_TEMP/versitygw.tar.gz" \
            https://github.com/versity/versitygw/releases/download/v1.11.0/versitygw_v1.11.0_Linux_x86_64.tar.gz
          mkdir -p "$RUNNER_TEMP/versitygw"
          tar xzf "$RUNNER_TEMP/versitygw.tar.gz" -C "$RUNNER_TEMP/versitygw" --strip-components=1
          chmod +x "$RUNNER_TEMP/versitygw/versitygw"
          echo "VERSITYGW_BIN=$RUNNER_TEMP/versitygw/versitygw" >> "$GITHUB_ENV"

      - name: Start authenticated S3 gateway
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/s3-data"
          nohup "$VERSITYGW_BIN" \
            --access TESTPRIMARY --secret primary-secret --region us-east-1 \
            --port 127.0.0.1:19000 posix "$RUNNER_TEMP/s3-data" \
            > "$RUNNER_TEMP/versitygw.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/versitygw.pid"
          for _ in $(seq 1 100); do
            if curl -s -o /dev/null http://127.0.0.1:19000/; then
              exit 0
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/versitygw.log"
          exit 1

      - name: Run authenticated S3 and AWS profile tests
        shell: bash
        env:
          MINIO_ENDPOINT: http://127.0.0.1:19000
          MINIO_ACCESS_KEY: TESTPRIMARY
          MINIO_SECRET_KEY: primary-secret
          MINIO_BUCKET: lancedb-go-integration
        run: go test -tags=integration -count=1 -v ./pkg/lancedb
